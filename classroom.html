/* ================= 知识点数据 ================= */
var K=[
 { id:0, t:'定义与术语', c:'#2f6f9e', at:0,
   b:'<h4>什么是二叉树</h4>'+
     '<p>二叉树是 <code>n (n≥0)</code> 个结点的有限集合：或为空树，或由一个根结点及两棵<b>互不相交</b>的、分别称为<b>左子树</b>和<b>右子树</b>的二叉树组成。</p>'+
     '<h4>最容易错的一点</h4>'+
     '<p>左右子树<b>有序</b>，不能互换。一个只有右孩子的结点，和一个只有左孩子的结点，是两棵不同的二叉树——这就是它和“度为 2 的普通树”的根本区别。</p>'+
     '<h4>术语</h4>'+
     '<p><span class="k">根</span>：最上面的结点　<span class="k">叶子</span>：度为 0 的结点<br>'+
     '<span class="k">度</span>：结点拥有的子树个数（0/1/2）<br>'+
     '<span class="k">层次</span>：根为第 1 层，往下递增<br>'+
     '<span class="k">深度</span>：从根往下数；<span class="k">高度</span>：从叶子往上数；树的高度 = 最大层次</p>'+
     '<h4>两个边界</h4>'+
     '<p>空树高度为 <code>0</code>；只有根结点的树高度为 <code>1</code>。递归算法里这个 0/1 的区别决定了边界条件写 <code>if(T==NULL)</code> 还是 <code>if(T->lchild==NULL && T->rchild==NULL)</code>。</p>' },
 { id:1, t:'特殊二叉树', c:'#3f7a52', at:36,
   b:'<h4>满二叉树</h4>'+
     '<p>每一层的结点数都达到最大。高度为 <code>h</code> 时共有 <code>2^h − 1</code> 个结点，叶子全部集中在最下一层。</p>'+
     '<h4>完全二叉树</h4>'+
     '<p>除最后一层外每层都满，且最后一层的结点<b>从左向右连续排列</b>，中间不能有空缺。</p>'+
     '<p>把结点按层序从 1 开始编号，完全二叉树的编号与同高度满二叉树<b>一一对应</b>——这条性质是顺序存储的基础。</p>'+
     '<h4>斜树</h4>'+
     '<p>每层只有一个结点，全部是左孩子叫左斜树，全部是右孩子叫右斜树。它退化成一条链表，高度 = 结点数。</p>'+
     '<h4>包含关系</h4>'+
     '<p><code>满二叉树 ⊂ 完全二叉树 ⊂ 一般二叉树</code></p>'+
     '<p>堆（大根堆/小根堆）就是一棵完全二叉树，所以能用数组存，下标关系直接算。</p>' },
 { id:2, t:'五个性质', c:'#8a6a24', at:72,
   b:'<h4>① 第 i 层最多 2^(i−1) 个结点</h4>'+
     '<p>每往下一层，结点数最多翻倍。</p>'+
     '<h4>② 高为 h 的二叉树最多 2^h − 1 个结点</h4>'+
     '<p>等比数列求和：1+2+4+…+2^(h−1) = 2^h − 1。</p>'+
     '<h4>③ n0 = n2 + 1</h4>'+
     '<p>推导：结点总数 <code>n = n0+n1+n2</code>；再看边数，除根外每个结点都有一条边进来，<code>n−1 = n1 + 2n2</code>。两式相减得 <code>n0 = n2 + 1</code>。</p>'+
     '<p>这条最常考：一棵树有 20 个叶子，则度为 2 的结点有 19 个。</p>'+
     '<h4>④ n 个结点的完全二叉树高度</h4>'+
     '<p><code>h = ⌊log₂n⌋ + 1</code></p>'+
     '<h4>⑤ 完全二叉树的下标关系</h4>'+
     '<p>结点 i 的左孩子 <code>2i</code>，右孩子 <code>2i+1</code>，双亲 <code>⌊i/2⌋</code>。</p>' },
 { id:3, t:'顺序存储', c:'#7a4a8a', at:108,
   b:'<h4>怎么存</h4>'+
     '<p>用一维数组按<b>层序</b>存放，根放在 <code>[1]</code>（或 <code>[0]</code>），结点 <code>i</code> 的左孩子在 <code>2i</code>、右孩子在 <code>2i+1</code>、双亲在 <code>⌊i/2⌋</code>。</p>'+
     '<h4>优点</h4>'+
     '<p>不需要指针，节省空间；找双亲、找孩子都是下标运算，O(1)；可以随机访问。</p>'+
     '<h4>缺点</h4>'+
     '<p>只适合完全二叉树。一般二叉树会浪费大量空位：一棵高度为 h 的右斜树只有 h 个结点，却要占 <code>2^h − 1</code> 个位置。</p>'+
     '<h4>空位怎么表示</h4>'+
     '<p>用一个特殊值（如 <code>0</code> 或 <code>#</code>）标记空结点，遍历时必须跳过。</p>'+
     '<p>正因为如此，一般的二叉树都用下面的二叉链表。</p>' },
 { id:4, t:'二叉链表', c:'#2f6f9e', at:144,
   b:'<h4>结构定义</h4>'+
     '<pre>typedef struct BiTNode {\n    TElemType data;\n    struct BiTNode *lchild, *rchild;\n} BiTNode, *BiTree;</pre>'+
     '<h4>指针账</h4>'+
     '<p>n 个结点共有 <code>2n</code> 个指针域，其中 <code>n−1</code> 个指向孩子（除根外每个结点被一个指针指向），剩下 <code>n+1</code> 个是空指针。</p>'+
     '<p>线索二叉树正是把这 <code>n+1</code> 个空指针利用起来，指向中序前驱/后继。</p>'+
     '<h4>只能单向走</h4>'+
     '<p>二叉链表只能<b>由父找子</b>，不能由子找父。想从某个结点回到它的祖先，只能靠<b>栈</b>把路径保存下来——这就是非递归遍历需要栈的根本原因。</p>'+
     '<p>如果经常需要找双亲，可以用三叉链表，多一个 <code>*parent</code> 域。</p>' },
 { id:5, t:'遍历的分类', c:'#3f7a52', at:180,
   b:'<h4>遍历的定义</h4>'+
     '<p>按某种次序访问二叉树中的每个结点，<b>每个结点恰好访问一次</b>。</p>'+
     '<h4>四种次序</h4>'+
     '<p><code>先序 DLR</code>　根 → 左 → 右<br>'+
     '<code>中序 LDR</code>　左 → 根 → 右<br>'+
     '<code>后序 LRD</code>　左 → 右 → 根<br>'+
     '<code>层次</code>　一层一层，从左到右</p>'+
     '<p>前三种看“根”排在第几位就能记住名字。</p>'+
     '<h4>各自用在哪</h4>'+
     '<p>先序：复制一棵树、输出表达式的前缀形式<br>'+
     '中序：二叉排序树的中序序列是<b>升序</b><br>'+
     '后序：释放所有结点、计算表达式的值<br>'+
     '层次：按层统计、求树的宽度</p>'+
     '<h4>由序列还原</h4>'+
     '<p>先序 + 中序、后序 + 中序可以唯一确定一棵二叉树；<b>先序 + 后序不行</b>，因为分不清左右子树。</p>' },
 { id:6, t:'递归遍历', c:'#8a6a24', at:216,
   b:'<h4>三行代码</h4>'+
     '<pre>void PreOrder(BiTree T){\n    if(T){\n        visit(T);              /* 先序：先访问根 */\n        PreOrder(T->lchild);\n        PreOrder(T->rchild);\n    }\n}</pre>'+
     '<p>中序只是把 <code>visit</code> 挪到两次递归中间，后序挪到最后——<b>三种递归只差一行位置</b>。</p>'+
     '<h4>“回来”靠什么</h4>'+
     '<p>靠<b>系统调用栈</b>。每一层递归都会把返回地址、参数 T、局部变量压进栈；函数返回时再从栈里恢复。所以递归本质上是“系统帮你维护了一个栈”。</p>'+
     '<h4>复杂度与风险</h4>'+
     '<p>时间 <code>O(n)</code>（每个结点访问一次）；空间 <code>O(h)</code>，h 为树高。<br>'+
     '斜树的 h = n，递归深度达到 n，结点数一多就会<b>爆栈</b>——这就是要学非递归的原因。</p>' },
 { id:7, t:'非递归与栈', c:'#7a4a8a', at:252,
   b:'<h4>先把递归改成栈</h4>'+
     '<p>递归能做的事，显式栈都能做：把“待处理的结点”压栈，循环弹出。</p>'+
     '<h4>先序（最简单）</h4>'+
     '<pre>push(S,T);\nwhile(!empty(S)){\n  pop(S,p); visit(p);\n  if(p->rchild) push(S,p->rchild);\n  if(p->lchild)  push(S,p->lchild);\n}</pre>'+
     '<p>注意入栈顺序：<b>右孩子先入、左孩子后入</b>，这样左孩子先出栈，才符合“根左右”。</p>'+
     '<h4>后序（最难）</h4>'+
     '<pre>while(p || !empty(S)){\n  while(p){ push(S,p); p=p->lchild; }\n  getTop(S,p);\n  if(p->rchild && p->rchild!=last) p=p->rchild;\n  else { visit(p); pop(S,p); last=p; p=NULL; }\n}</pre>'+
     '<h4>为什么要 last</h4>'+
     '<p>后序要求根在左右子树之后访问。从栈顶看到一个结点时，有两种情况：<br>'+
     '① 它的右子树<b>还没做</b> → 转去右子树；<br>'+
     '② 它的右子树<b>刚做完</b>（右孩子 == last）→ 现在可以访问它了。</p>'+
     '<p>没有 <code>last</code> 就分不清这两种情况，会重复进入右子树造成<b>死循环</b>。</p>' },
 { id:8, t:'层次与队列', c:'#2f6f9e', at:288,
   b:'<h4>做法</h4>'+
     '<pre>InitQueue(Q); EnQueue(Q,T);\nwhile(!QueueEmpty(Q)){\n  DeQueue(Q,p); visit(p);\n  if(p->lchild) EnQueue(Q,p->lchild);\n  if(p->rchild) EnQueue(Q,p->rchild);\n}</pre>'+
     '<p>根入队，然后“出一个、进两个”，队列里始终按层排列。</p>'+
     '<h4>为什么是队列</h4>'+
     '<p>队列先进先出，保证<b>先被访问的结点的孩子，先被访问</b>——这正是“按层推进”。用栈会变成深度优先。</p>'+
     '<h4>循环队列</h4>'+
     '<p><code>rear = (rear+1) % MAXSIZE</code>，<code>front = (front+1) % MAXSIZE</code></p>'+
     '<p>队空：<code>front == rear</code>；队满：<code>(rear+1) % MAXSIZE == front</code>（牺牲一个单元来区分空和满）。</p>'+
     '<h4>用途</h4>'+
     '<p>求树的宽度、按层打印、判断一棵树是否完全二叉树（遇到空结点后不该再有非空结点）。</p>' },
 { id:9, t:'建树与还原', c:'#8a4a3a', at:324,
   b:'<h4>按先序扩展序列建树</h4>'+
     '<pre>void Create(BiTree *T, char *s, int *i){\n  char ch = s[(*i)++];\n  if(ch==\'#\') { *T=NULL; return; }\n  *T = new BiTNode; (*T)->data = ch;\n  Create(&(*T)->lchild, s, i);\n  Create(&(*T)->rchild, s, i);\n}</pre>'+
     '<h4>易错点：游标</h4>'+
     '<p>读指针必须<b>三个递归共用同一个</b>。所以要用 <code>*int</code> 或全局变量传递；如果写成普通的 <code>int i</code> 值传递，每次递归都是副本，读到的永远是第一个字符。</p>'+
     '<p>例如 <code>ABD##E##CF###</code> 建出的树是 A(B(D,E), C(F,∅))。</p>'+
     '<h4>由两种序列还原</h4>'+
     '<p>先序的第一个字符是根；在中序里找到它，左边是左子树、右边是右子树；对左右区间递归即可。</p>'+
     '<p>后序则从<b>最后一个</b>字符开始往前找根。</p>' }
];

function focalOf(){ return Math.min(cv.clientWidth||360, cv.clientHeight||640)*0.92; }

function project(x,y,z,vp){
  var dx=x-vp.ex, dy=y-vp.ey, dz=z-vp.ez;
  var c=Math.cos(vp.yaw), s=Math.sin(vp.yaw);
  var Xc=dx*c-dz*s, d=-(dx*s+dz*c);
  if(d<=0.06) return null;
  var cp=Math.cos(vp.pitch), sp=Math.sin(vp.pitch);
  var Yc=dy*cp-d*sp, d2=dy*sp+d*cp;
  if(d2<=0.06) return null;
  var f=vp.focal/d2;
  return {x:vp.vw/2+Xc*f+vp.shiftX, y:vp.vh/2-Yc*f, f:f, d:d2};
}

(function buildRoom(){
  var XL=-4.2, XR=4.2, ZB=-4.8, ZF=4.2, H=3.15;
  function quad(p,fill,opt){
    opt=opt||{};
    var ax=p[1][0]-p[0][0], ay=p[1][1]-p[0][1], az=p[1][2]-p[0][2];
    var bx=p[2][0]-p[0][0], by=p[2][1]-p[0][1], bz=p[2][2]-p[0][2];
    var nx=ay*bz-az*by, ny=az*bx-ax*bz, nz=ax*by-ay*bx;
    var L=Math.sqrt(nx*nx+ny*ny+nz*nz)||1;
    var lam=Math.abs((nx*0.30+ny*0.80+nz*-0.52)/L);
    ROOM.push({p:p,fill:fill,shade:0.62+0.38*lam,alpha:opt.alpha,line:opt.line});
  }
  /* 地板：木地板条 */
  var cols=6, rows=7;
  for(var i=0;i<cols;i++) for(var j=0;j<rows;j++){
    var x0=XL+2*(XR-XL)*i/(2*cols), x1=XL+2*(XR-XL)*(i+1)/(2*cols);
    var z0=ZB+(ZF-ZB)*j/rows, z1=ZB+(ZF-ZB)*(j+1)/rows;
    quad([[x0,0,z0],[x1,0,z0],[x1,0,z1],[x0,0,z1]],
         (i+j)%2?'#4c3d2c':'#554434', {line:'#6a5540'});
  }
  /* 天花板 */
  for(var i2=0;i2<3;i2++) for(var j2=0;j2<3;j2++){
    var a0=XL+2*(XR-XL)*i2/(2*3), a1=XL+2*(XR-XL)*(i2+1)/(2*3);
    var b0=ZB+(ZF-ZB)*j2/3, b1=ZB+(ZF-ZB)*(j2+1)/3;
    quad([[a0,H,b0],[a1,H,b0],[a1,H,b1],[a0,H,b1]], '#2b3444');
  }
  /* 后墙（讲台侧）：下半墙裙 + 上半墙面 */
  for(var i3=0;i3<4;i3++){
    var c0=XL+2*(XR-XL)*i3/(2*4), c1=XL+2*(XR-XL)*(i3+1)/(2*4);
    quad([[c0,0,ZB],[c1,0,ZB],[c1,0.95,ZB],[c0,0.95,ZB]], '#5d7187');
    quad([[c0,0.95,ZB],[c1,0.95,ZB],[c1,H,ZB],[c0,H,ZB]], '#6a7f97');
  }
  /* 左右墙 */
  for(var j3=0;j3<3;j3++){
    var d0=ZB+(ZF-ZB)*j3/3, d1=ZB+(ZF-ZB)*(j3+1)/3;
    quad([[XL,0,d0],[XL,0,d1],[XL,0.95,d1],[XL,0.95,d0]], '#525d70');
    quad([[XL,0.95,d0],[XL,0.95,d1],[XL,H,d1],[XL,H,d0]], '#5f6d84');
    quad([[XR,0,d0],[XR,0,d1],[XR,0.95,d1],[XR,0.95,d0]], '#525d70');
    quad([[XR,0.95,d0],[XR,0.95,d1],[XR,H,d1],[XR,H,d0]], '#5f6d84');
  }
  /* 前墙（身后） */
  quad([[XL,0,ZF],[XR,0,ZF],[XR,H,ZF],[XL,H,ZF]], '#48525f');

  /* 黑板 + 边框 + 粉笔槽 */
  quad([[-2.95,0.85,ZB+0.04],[2.95,0.85,ZB+0.04],[2.95,2.55,ZB+0.04],[-2.95,2.55,ZB+0.04]], '#1c3a2c', {line:'#5d8d74'});
  quad([[-3.05,0.78,ZB+0.05],[3.05,0.78,ZB+0.05],[3.05,0.86,ZB+0.05],[-3.05,0.86,ZB+0.05]], '#8a9099');
  quad([[-2.95,2.55,ZB+0.05],[2.95,2.55,ZB+0.05],[2.95,2.62,ZB+0.05],[-2.95,2.62,ZB+0.05]], '#6d747d');

  /* 讲台 + 讲桌 */
  quad([[-2.2,0,ZB+0.55],[2.2,0,ZB+0.55],[2.2,0.18,ZB+0.55],[-2.2,0.18,ZB+0.55]], '#6b5a44');
  quad([[-2.2,0.18,ZB+0.55],[2.2,0.18,ZB+0.55],[2.2,0.18,ZB+1.15],[-2.2,0.18,ZB+1.15]], '#7d6a50');
  quad([[-2.2,0,ZB+1.15],[2.2,0,ZB+1.15],[2.2,0.18,ZB+1.15],[-2.2,0.18,ZB+1.15]], '#5c4d3a');

  /* 课桌：3 列 × 3 排 */
  var xs=[-2.55,0,2.55], zs=[-2.55,-1.45,-0.35];
  zs.forEach(function(cz){
    xs.forEach(function(cx){
      var w=1.25, dp=0.62, hh=0.76;
      quad([[cx-w/2,hh,cz-dp/2],[cx+w/2,hh,cz-dp/2],[cx+w/2,hh,cz+dp/2],[cx-w/2,hh,cz+dp/2]], '#8a7355');
      quad([[cx-w/2,hh-0.06,cz-dp/2],[cx+w/2,hh-0.06,cz-dp/2],[cx+w/2,hh-0.06,cz+dp/2],[cx-w/2,hh-0.06,cz+dp/2]], '#5a4b39');
      quad([[cx-w/2,0,cz-dp/2],[cx+w/2,0,cz-dp/2],[cx+w/2,hh-0.06,cz-dp/2],[cx-w/2,hh-0.06,cz-dp/2]], '#564836');
      quad([[cx+w/2,0,cz+dp/2],[cx-w/2,0,cz+dp/2],[cx-w/2,hh-0.06,cz+dp/2],[cx+w/2,hh-0.06,cz+dp/2]], '#4b3f30');
      quad([[cx+w/2,0,cz-dp/2],[cx+w/2,0,cz+dp/2],[cx+w/2,hh-0.06,cz+dp/2],[cx+w/2,hh-0.06,cz-dp/2]], '#463a2c');
      /* 椅子 */
      var chz=cz+0.62;
      quad([[cx-w/3,0.45,chz],[cx+w/3,0.45,chz],[cx+w/3,0.45,chz+0.44],[cx-w/3,0.45,chz+0.44]], '#41506a');
      quad([[cx-w/3,0.45,chz+0.44],[cx+w/3,0.45,chz+0.44],[cx+w/3,0.95,chz+0.44],[cx-w/3,0.95,chz+0.44]], '#39465c');
      quad([[cx-w/3,0,chz],[cx-w/3,0,chz+0.44],[cx-w/3,0.45,chz+0.44],[cx-w/3,0.45,chz]], '#323d4f');
      quad([[cx+w/3,0,chz],[cx+w/3,0,chz+0.44],[cx+w/3,0.45,chz+0.44],[cx+w/3,0.45,chz]], '#323d4f');
    });
  });

  /* 左墙 3 扇窗 + 地面光斑 */
  for(var k2=0;k2<3;k2++){
    var zz=-3.0+k2*2.3;
    quad([[XL+0.04,1.15,zz],[XL+0.04,1.15,zz+1.7],[XL+0.04,2.6,zz+1.7],[XL+0.04,2.6,zz]], '#9fd2f2', {alpha:0.95,line:'#d9efff'});
    quad([[XL+0.05,1.86,zz],[XL+0.05,1.92,zz+1.7],[XL+0.05,1.92,zz+1.7],[XL+0.05,1.86,zz]], '#ffffff', {alpha:0.25});
    quad([[XL+0.05,1.86,zz],[XL+0.05,1.86,zz+1.7],[XL+0.05,1.92,zz+1.7],[XL+0.05,1.92,zz]], '#cfe9f8', {alpha:0.45});
    quad([[XL+0.05,1.15,zz+0.82],[XL+0.05,1.15,zz+0.88],[XL+0.05,2.6,zz+0.88],[XL+0.05,2.6,zz+0.82]], '#cfe9f8', {alpha:0.45});
    quad([[XL+0.2,0.014,zz-0.2],[-0.8,0.014,zz+0.9],[-0.4,0.014,zz+0.1],[XL+0.2,0.014,zz-0.9]], '#a9d8f5', {alpha:0.10});
  }
  /* 顶灯 6 块 */
  [[-2.6,-2.6],[0,-2.6],[2.6,-2.6],[-2.6,0.9],[0,0.9],[2.6,0.9]].forEach(function(l){
    quad([[l[0]-0.6,H-0.03,l[1]-0.3],[l[0]+0.6,H-0.03,l[1]-0.3],[l[0]+0.6,H-0.03,l[1]+0.3],[l[0]-0.6,H-0.03,l[1]+0.3]], '#e6f1ff', {alpha:0.8});
  });
  /* 后门 */
  quad([[XR-0.04,0,2.4],[XR-0.04,0,3.5],[XR-0.04,2.1,3.5],[XR-0.04,2.1,2.4]], '#6a5236', {alpha:0.95});
})();

function shade(hex,f){
  var r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return 'rgb('+Math.min(255,Math.round(r*f))+','+Math.min(255,Math.round(g*f))+','+Math.min(255,Math.round(b*f))+')';
}
function drawRoom(vp){
  var list=[];
  for(var i=0;i<ROOM.length;i++){
    var f=ROOM[i], ps=[], ok=true, ds=0;
    for(var k=0;k<4;k++){
      var p=project(f.p[k][0],f.p[k][1],f.p[k][2],vp);
      if(!p){ ok=false; break; }
      ps.push(p); ds+=p.d;
    }
    if(ok) list.push({ps:ps,d:ds/4,f:f});
  }
  list.sort(function(a,b){ return b.d-a.d; });
  for(var j=0;j<list.length;j++){
    var it=list[j];
    ctx.beginPath(); ctx.moveTo(it.ps[0].x,it.ps[0].y);
    for(var q=1;q<4;q++) ctx.lineTo(it.ps[q].x,it.ps[q].y);
    ctx.closePath();
    ctx.globalAlpha=it.f.alpha||1;
    ctx.fillStyle=shade(it.f.fill,it.f.shade); ctx.fill();
    if(it.f.line){ ctx.globalAlpha=0.3; ctx.strokeStyle=it.f.line; ctx.lineWidth=1; ctx.stroke(); }
    ctx.globalAlpha=1;
  }
}

/* ================= 关联线 + 卡片 ================= */
function drawChalk(vp){
  var p=project(0,2.02,-4.74,vp);
  if(!p) return;
  var f=p.f;
  ctx.save();
  ctx.globalAlpha=0.85;
  ctx.fillStyle='rgba(226,240,232,.92)';
  ctx.textAlign='center';
  ctx.font='bold '+Math.round(0.16*f)+'px "Microsoft YaHei",sans-serif';
  ctx.fillText('二叉树的遍历', p.x, p.y);
  ctx.font=Math.round(0.085*f)+'px "Microsoft YaHei",sans-serif';
  ctx.globalAlpha=0.62;
  ctx.fillStyle='rgba(200,225,210,.9)';
  ctx.fillText('先序 DLR　中序 LDR　后序 LRD　层次', p.x, p.y-0.66*f);
  ctx.restore();
}
function nodePos(i){
  return i<0 ? {x:ROOT.x,y:ROOT.y,z:-2.45} : {x:K[i].x,y:K[i].y,z:K[i].z};
}
function drawLinks(vp){
  if(!S.showLinks) return;
  LINKS.forEach(function(L){
    var A=nodePos(L[0]), B=nodePos(L[1]);
    var pa=project(A.x,A.y,A.z,vp), pb=project(B.x,B.y,B.z,vp);
    if(!pa||!pb) return;
    var act = (S.sel===L[0]||S.sel===L[1]||S.hover===L[0]||S.hover===L[1]);
    var mx=(pa.x+pb.x)/2, my=(pa.y+pb.y)/2;
    var dx=pb.x-pa.x, dy=pb.y-pa.y, len=Math.hypot(dx,dy)||1;
    var cx2=mx - dy/len*Math.min(46,len*0.22), cy2=my + dx/len*Math.min(46,len*0.22);
    ctx.strokeStyle=act?'rgba(140,230,255,.95)':'rgba(120,180,235,.42)';
    ctx.lineWidth=act?3:1.7;
    if(act){ ctx.shadowColor='rgba(120,220,255,.85)'; ctx.shadowBlur=14; }
    ctx.beginPath(); ctx.moveTo(pa.x,pa.y); ctx.quadraticCurveTo(cx2,cy2,pb.x,pb.y); ctx.stroke();
    ctx.shadowBlur=0;
  });
  // 根节点
  var P=project(ROOT.x,ROOT.y,-2.45,vp);
  if(P){
    ctx.fillStyle='rgba(9,17,28,.9)';
    var w=Math.max(56,0.78*P.f), hh=w*0.44;
    ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(P.x-w/2,P.y-hh/2,w,hh,10); else ctx.rect(P.x-w/2,P.y-hh/2,w,hh);
    ctx.fill();
    ctx.strokeStyle='rgba(150,210,255,.7)'; ctx.lineWidth=1.6; ctx.stroke();
    ctx.fillStyle='#a9e0ff';
    ctx.font='bold '+Math.max(11,Math.round(w*0.2))+'px "Microsoft YaHei",sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('二叉树', P.x, P.y);
    ctx.textBaseline='alphabetic';
  }
}
function drawCards(vp){
  S.hit=[];
  var arr=K.map(function(k){ var p=project(k.x,k.y,k.z,vp); return p?{k:k,p:p}:null; })
           .filter(Boolean).sort(function(a,b){ return b.p.d-a.p.d; });
  arr.forEach(function(o){
    var k=o.k,p=o.p;
    var w=Math.max(76,Math.min(230,0.9*p.f)), h=w*0.44;
    var x=p.x-w/2, y=p.y-h/2;
    var sel=(S.sel===k.id), hov=(S.hover===k.id);
    S.hit.push({x:x,y:y,w:w,h:h,k:k});

    ctx.globalAlpha=sel?1:Math.max(0.55,Math.min(1,2.4-p.d*0.12));
    ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(x,y,w,h,9); else ctx.rect(x,y,w,h);
    var g=ctx.createLinearGradient(x,y,x,y+h);
    g.addColorStop(0,k.c); g.addColorStop(0.55,'#16222f'); g.addColorStop(1,'#0e1621');
    ctx.fillStyle=g;
    if(sel||hov){ ctx.shadowColor=k.c; ctx.shadowBlur=sel?26:16; }
    ctx.fill(); ctx.shadowBlur=0;
    ctx.strokeStyle=sel?'rgba(180,230,255,.95)':'rgba(140,185,235,.42)';
    ctx.lineWidth=sel?2:1; ctx.stroke();

    // 顶部色条
    ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(x,y,w,4,2); else ctx.rect(x,y,w,4);
    ctx.fillStyle='rgba(255,255,255,.55)'; ctx.fill();

    ctx.fillStyle='#eaf4ff';
    ctx.font='bold '+Math.max(10,Math.round(w*0.1))+'px "Microsoft YaHei",sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(k.t, x+w/2, y+h*0.44);
    ctx.fillStyle='rgba(170,205,235,.65)';
    ctx.font=Math.max(8,Math.round(w*0.055))+'px "Microsoft YaHei",sans-serif';
    ctx.fillText('点击展开', x+w/2, y+h*0.74);
    ctx.globalAlpha=1;
  });
  ctx.textBaseline='alphabetic';
}

/* 罗盘：显示四周知识点方位 */
var cm=document.getElementById('compass'), cctx=cm.getContext('2d');
function drawCompass(){
  var W=cm.width,H=cm.height;
  cctx.clearRect(0,0,W,H);
  var cx=W/2, cy=H-24, R=58;
  cctx.save();
  cctx.globalAlpha=0.9;
  cctx.beginPath(); cctx.arc(cx,cy,R,Math.PI,0); cctx.strokeStyle='rgba(90,130,175,.35)'; cctx.lineWidth=1; cctx.stroke();
  K.forEach(function(k){
    var ang=Math.atan2(k.x-S.eye.x, -(k.z-S.eye.z));   // 相对正前方
    var rel=ang-S.yaw;
    if(Math.abs(rel)>Math.PI*0.92) return;
    var px=cx+Math.sin(rel)*R*0.92, py=cy-Math.cos(rel)*R*0.92;
    cctx.beginPath(); cctx.arc(px,py,S.sel===k.id?4:2.6,0,Math.PI*2);
    cctx.fillStyle=S.sel===k.id?'#ffd479':k.c; cctx.fill();
  });
  cctx.beginPath(); cctx.moveTo(cx-5,cy+4); cctx.lineTo(cx+5,cy+4); cctx.lineTo(cx,cy-4);
  cctx.closePath(); cctx.fillStyle='#8fd3ff'; cctx.fill();
  cctx.restore();
}

var TW=null;
function lookAt(t){
  var dx=t[0]-S.eye.x, dy=t[1]-S.eye.y, dz=t[2]-S.eye.z;
  return {yaw:Math.atan2(-dx,-dz), pitch:Math.atan2(dy,Math.hypot(dx,dz))};
}
function gotoView(i){
  var v=VIEWS[i]; if(!v) return;
  var tg={ex:v.e[0],ey:v.e[1],ez:v.e[2]};
  var la=lookAt(v.t);
  TW={t0:performance.now(),dur:620,
      from:{ex:S.eye.x,ey:S.eye.y,ez:S.eye.z,yaw:S.yaw,pitch:S.pitch},
      to:{ex:tg.ex,ey:tg.ey,ez:tg.ez,yaw:la.yaw,pitch:la.pitch}};
}
function stepTween(){
  if(!TW) return;
  var k=Math.min(1,(performance.now()-TW.t0)/TW.dur);
  var e=k<0.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
  S.eye.x=TW.from.ex+(TW.to.ex-TW.from.ex)*e;
  S.eye.y=TW.from.ey+(TW.to.ey-TW.from.ey)*e;
  S.eye.z=TW.from.ez+(TW.to.ez-TW.from.ez)*e;
  var dyaw=TW.to.yaw-TW.from.yaw;
  while(dyaw>Math.PI) dyaw-=Math.PI*2;
  while(dyaw<-Math.PI) dyaw+=Math.PI*2;
  S.yaw=TW.from.yaw+dyaw*e;
  S.pitch=TW.from.pitch+(TW.to.pitch-TW.from.pitch)*e;
  if(k>=1) TW=null;
}

/* ================= 渲染 ================= */
function vp(full,shiftX){
  var W=cv.clientWidth||360,H=cv.clientHeight||640;
  return {vw:full?W:W/2,vh:H,ex:S.eye.x,ey:S.eye.y,ez:S.eye.z,yaw:S.yaw,pitch:S.pitch,
          focal:focalOf(),shiftX:shiftX||0};
}
function render(){
  var W=cv.clientWidth||360,H=cv.clientHeight||640;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  var bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#070c14'); bg.addColorStop(1,'#04060a');
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);

  if(!S.stereo){
    var v=vp(true,0);
    drawRoom(v); drawChalk(v); drawLinks(v); drawCards(v);
  } else {
    var e0=0.045;
    [{ox:0,off:-e0},{ox:W/2,off:e0}].forEach(function(e){
      ctx.save(); ctx.beginPath(); ctx.rect(e.ox,0,W/2,H); ctx.clip(); ctx.translate(e.ox,0);
      var v2=vp(false,0); v2.ex+=Math.cos(S.yaw)*e.off; v2.ez+=-Math.sin(S.yaw)*e.off;
      drawRoom(v2); drawChalk(v2); drawLinks(v2);
      ctx.restore();
    });
    ctx.setTransform(DPR,0,0,DPR,0,0);
    ctx.strokeStyle='rgba(0,0,0,.85)'; ctx.beginPath(); ctx.moveTo(W/2,0); ctx.lineTo(W/2,H); ctx.stroke();
  }
  drawCompass();
}

/* ================= 面板 ================= */
function toast(t){ var el=document.getElementById('toast'); el.textContent=t; el.classList.add('show');
  clearTimeout(el._t); el._t=setTimeout(function(){el.classList.remove('show');},1500); }

function openK(k){
  S.sel=k.id;
  document.getElementById('pK').textContent='知识点 '+String.fromCharCode(65+k.id);
  document.getElementById('pT').textContent=k.t;
  var rel=LINKS.filter(function(L){ return L[0]===k.id||L[1]===k.id; })
               .map(function(L){ return L[0]===k.id?L[1]:L[0]; });
  var uniq=[]; rel.forEach(function(r){ if(uniq.indexOf(r)<0) uniq.push(r); });
  var links='<div id="links"><div style="color:#5d7d9c;font-size:11px;margin-bottom:6px">关联知识点</div>'+
    uniq.map(function(r){ return '<span class="l" data-id="'+r+'">'+K[r].t+'</span>'; }).join('')+'</div>';
  document.getElementById('panelBody').innerHTML=k.b+links;
  document.getElementById('panel').classList.add('on');
  Array.prototype.forEach.call(document.querySelectorAll('#links .l'),function(el){
    el.addEventListener('click',function(){ openK(K[+el.getAttribute('data-id')]); });
  });
}
document.getElementById('pX').addEventListener('click',function(){
  document.getElementById('panel').classList.remove('on'); S.sel=-1;
});

/* ================= 交互 ================= */
cv.addEventListener('mousedown',function(e){ S.drag={x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY}; });
window.addEventListener('mouseup',function(e){
  if(S.drag){
    var moved=Math.abs(e.clientX-S.drag.sx)+Math.abs(e.clientY-S.drag.sy);
    if(moved<5){
      var r=cv.getBoundingClientRect(), mx=e.clientX-r.left, my=e.clientY-r.top;
      for(var i=S.hit.length-1;i>=0;i--){
        var h=S.hit[i];
        if(mx>=h.x&&mx<=h.x+h.w&&my>=h.y&&my<=h.y+h.h){ openK(h.k); break; }
      }
    }
  }
  S.drag=null;
});
window.addEventListener('mousemove',function(e){
  if(S.drag){
    S.yaw+=(e.clientX-S.drag.x)*0.004;
    S.pitch=Math.max(-1.0,Math.min(1.0,S.pitch+(e.clientY-S.drag.y)*0.003));
    S.drag.x=e.clientX; S.drag.y=e.clientY;
    document.getElementById('hint').style.opacity=0;
  } else {
    var r=cv.getBoundingClientRect(), mx=e.clientX-r.left, my=e.clientY-r.top;
    S.hover=-1;
    for(var i=S.hit.length-1;i>=0;i--){
      var h=S.hit[i];
      if(mx>=h.x&&mx<=h.x+h.w&&my>=h.y&&my<=h.y+h.h){ S.hover=h.k.id; break; }
    }
  }
});
cv.addEventListener('wheel',function(e){ e.preventDefault();
  S.eye.x+=Math.sin(S.yaw)*e.deltaY*0.0016;
  S.eye.z-=Math.cos(S.yaw)*e.deltaY*0.0016;
  S.eye.x=Math.max(-5,Math.min(5,S.eye.x));
  S.eye.z=Math.max(-3.4,Math.min(3.4,S.eye.z));
},{passive:false});

var touchStart=null;
cv.addEventListener('touchstart',function(e){
  if(e.touches.length===1){ var t=e.touches[0]; touchStart={x:t.clientX,y:t.clientY,sx:t.clientX,sy:t.clientY}; }
},{passive:true});
cv.addEventListener('touchmove',function(e){
  if(touchStart&&e.touches.length===1){ var t=e.touches[0];
    S.yaw+=(t.clientX-touchStart.x)*0.005;
    S.pitch=Math.max(-1.0,Math.min(1.0,S.pitch+(t.clientY-touchStart.y)*0.004));
    touchStart.x=t.clientX; touchStart.y=t.clientY;
    document.getElementById('hint').style.opacity=0; }
},{passive:true});
cv.addEventListener('touchend',function(e){
  if(touchStart){
    var t=e.changedTouches[0];
    if(t && Math.abs(t.clientX-touchStart.sx)+Math.abs(t.clientY-touchStart.sy)<8){
      var r=cv.getBoundingClientRect(), mx=t.clientX-r.left, my=t.clientY-r.top;
      for(var i=S.hit.length-1;i>=0;i--){
        var h=S.hit[i];
        if(mx>=h.x&&mx<=h.x+h.w&&my>=h.y&&my<=h.y+h.h){ openK(h.k); break; }
      }
    }
  }
  touchStart=null;
});

Array.prototype.forEach.call(document.querySelectorAll('.vp'),function(b){
  b.addEventListener('click',function(){
    Array.prototype.forEach.call(document.querySelectorAll('.vp'),function(x){ x.classList.remove('on'); });
    b.classList.add('on');
    gotoView(+b.getAttribute('data-v'));
    document.getElementById('hint').style.opacity=0;
  });
});
document.getElementById('reset').addEventListener('click',function(){
  gotoView(0);
  document.getElementById('hint').style.opacity=1;
});
document.getElementById('mapBtn').addEventListener('click',function(){
  S.showLinks=!S.showLinks; this.classList.toggle('on',S.showLinks);
  toast(S.showLinks?'显示知识点关联线':'隐藏关联线');
});
document.getElementById('stereo').addEventListener('click',function(){
  S.stereo=!S.stereo; this.classList.toggle('on',S.stereo);
  toast(S.stereo?'立体分屏：横屏放进 Cardboard 盒子':'已退出分屏');
});
document.getElementById('gyro').addEventListener('click',function(){
  var btn=this;
  function start(){ window.addEventListener('deviceorientation',onOri); btn.classList.add('on'); toast('陀螺仪已开启'); }
  if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){
    DeviceOrientationEvent.requestPermission().then(function(r){ if(r==='granted') start(); else toast('未获得权限'); });
  } else if(window.DeviceOrientationEvent){ start(); } else { toast('不支持陀螺仪'); }
});
var base=null;
function onOri(e){
  if(e.alpha==null) return;
  if(base===null) base={a:e.alpha,b:e.beta};
  S.yaw=-((e.alpha-base.a)*Math.PI/180);
  S.pitch=Math.max(-1.0,Math.min(1.0,((e.beta-base.b)*Math.PI/180)-0.15));
  document.getElementById('hint').style.opacity=0;
}

function resize(){
  var r=cv.getBoundingClientRect();
  var w=Math.round((r.width||window.innerWidth||360)*DPR), h=Math.round((r.height||window.innerHeight||640)*DPR);
  if(w>0&&h>0&&(w!==cv.width||h!==cv.height)){ cv.width=w; cv.height=h; }
}
window.addEventListener('resize',resize);
function tick(){ stepTween(); render(); requestAnimationFrame(tick); }
resize();
setTimeout(function(){ var el=document.getElementById('hint'); if(el) el.style.opacity=0; }, 6000);
window.__S=S; window.__K=K;
requestAnimationFrame(tick);
})();
</script>
</body>
</html>
