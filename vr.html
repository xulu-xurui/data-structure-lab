<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>VR 虚拟教室 · 二叉树全景课堂</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#05070c;color:#e6eef8;
    font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif}
  canvas#cv{display:block;width:100%;height:100%;touch-action:none}
  .hud{position:fixed;background:rgba(9,14,22,.82);border:1px solid #22304a;border-radius:10px;
    backdrop-filter:blur(8px);font-size:12px}
  #top{left:14px;top:12px;right:14px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;
    padding:8px 10px;max-height:96px;overflow:auto}
  #top b{color:#8fd3ff;margin-right:6px;font-weight:600}
  button{padding:5px 9px;font-size:12px;border-radius:7px;border:1px solid #2b3a54;
    background:#121a28;color:#c6d2e2;cursor:pointer;font-family:inherit;white-space:nowrap}
  button:hover{background:#1a2436}
  button.on{background:#1d4f66;border-color:#2f7f9e;color:#cdf1ff}
  #cap{left:50%;transform:translateX(-50%);bottom:74px;width:min(860px,92vw);padding:14px 20px;
    border-radius:14px;background:rgba(8,13,21,.92);border:1px solid #24384f;line-height:1.9}
  #cap h3{margin:0 0 6px;font-size:15px;color:#9fd8ff;font-weight:600}
  #cap p{margin:0;font-size:13.5px;color:#c3d2e4}
  #cap .em{color:#ffd479}
  #ctrl{left:50%;transform:translateX(-50%);bottom:16px;display:flex;gap:8px;align-items:center;
    padding:8px 12px;border-radius:12px}
  #ctrl button{min-width:76px}
  #prog{color:#7d90aa;font-size:12px;margin:0 6px;font-variant-numeric:tabular-nums}
  #tip{right:14px;top:120px;padding:8px 10px;color:#7d90aa;width:150px;line-height:1.7;display:none}
  @media (max-width:640px){
    #top{left:8px;right:8px;top:8px;font-size:11px;max-height:120px}
    #cap{bottom:64px;padding:10px 14px;width:94vw}
    #cap h3{font-size:13px} #cap p{font-size:12px}
    #ctrl{bottom:8px;padding:6px} #ctrl button{min-width:58px;font-size:12px}
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div class="hud" id="top">
  <b>章节</b>
  <button class="ch on" data-c="0">1 认识二叉树</button>
  <button class="ch" data-c="1">2 术语</button>
  <button class="ch" data-c="2">3 五大性质</button>
  <button class="ch" data-c="3">4 特殊二叉树</button>
  <button class="ch" data-c="4">5 遍历</button>
  <button class="ch" data-c="5">6 存储</button>
  <button class="ch" data-c="6">7 哈夫曼树</button>
</div>

<div class="hud" id="cap">
  <h3 id="capT">—</h3>
  <p id="capB">—</p>
</div>

<div class="hud" id="ctrl">
  <button id="prev">← 上一步</button>
  <button id="play">▶ 播放</button>
  <button id="next">下一步 →</button>
  <span id="prog">1 / 1</span>
</div>

<script>
(function(){
'use strict';
var cv=document.getElementById('cv'), ctx=cv.getContext('2d');
var DPR=Math.min(window.devicePixelRatio||1,2);

/* ================= 数学 / 相机 ================= */
function project(x,y,z,vp){
  var dx=x-vp.ex, dy=y-vp.ey, dz=z-vp.ez;
  var c=Math.cos(vp.yaw), s=Math.sin(vp.yaw);
  var Xc=dx*c-dz*s, d=-(dx*s+dz*c);
  if(d<=0.06) return null;
  var cp=Math.cos(vp.pitch), sp=Math.sin(vp.pitch);
  var Yc=dy*cp-d*sp, d2=dy*sp+d*cp;
  if(d2<=0.06) return null;
  var f=vp.focal/d2;
  return {x:vp.vw/2+Xc*f+vp.shiftX, y:vp.vh/2-Yc*f, f:f, d:d2};
}
function rgba(hex,a){
  var r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return 'rgba('+r+','+g+','+b+','+a+')';
}
function shade(hex,f){
  var r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return 'rgb('+Math.min(255,Math.round(r*f))+','+Math.min(255,Math.round(g*f))+','+Math.min(255,Math.round(b*f))+')';
}

/* ================= 教室 ================= */
var ROOM=[];
(function buildRoom(){
  var XL=-4.2,XR=4.2,ZB=-4.8,ZF=4.2,H=3.15;
  function quad(p,fill,opt){
    opt=opt||{};
    var ax=p[1][0]-p[0][0],ay=p[1][1]-p[0][1],az=p[1][2]-p[0][2];
    var bx=p[2][0]-p[0][0],by=p[2][1]-p[0][1],bz=p[2][2]-p[0][2];
    var nx=ay*bz-az*by,ny=az*bx-ax*bz,nz=ax*by-ay*bx;
    var L=Math.sqrt(nx*nx+ny*ny+nz*nz)||1;
    var lam=Math.abs((nx*.3+ny*.8+nz*-.52)/L);
    ROOM.push({p:p,fill:fill,shade:0.55+0.35*lam,alpha:opt.alpha,line:opt.line});
  }
  var cols=6,rows=7;
  for(var i=0;i<cols;i++)for(var j=0;j<rows;j++){
    var x0=XL+2*(XR-XL)*i/(2*cols),x1=XL+2*(XR-XL)*(i+1)/(2*cols);
    var z0=ZB+(ZF-ZB)*j/rows,z1=ZB+(ZF-ZB)*(j+1)/rows;
    quad([[x0,0,z0],[x1,0,z0],[x1,0,z1],[x0,0,z1]],(i+j)%2?'#332a20':'#3a3025',{line:'#54432f'});
  }
  for(var i2=0;i2<3;i2++)for(var j2=0;j2<3;j2++){
    var a0=XL+2*(XR-XL)*i2/6,a1=XL+2*(XR-XL)*(i2+1)/6;
    var b0=ZB+(ZF-ZB)*j2/3,b1=ZB+(ZF-ZB)*(j2+1)/3;
    quad([[a0,H,b0],[a1,H,b0],[a1,H,b1],[a0,H,b1]],'#1c2431');
  }
  for(var i3=0;i3<4;i3++){
    var c0=XL+2*(XR-XL)*i3/8,c1=XL+2*(XR-XL)*(i3+1)/8;
    quad([[c0,0,ZB],[c1,0,ZB],[c1,0.95,ZB],[c0,0.95,ZB]],'#3f4d5f');
    quad([[c0,0.95,ZB],[c1,0.95,ZB],[c1,H,ZB],[c0,H,ZB]],'#48566a');
  }
  for(var j3=0;j3<3;j3++){
    var d0=ZB+(ZF-ZB)*j3/3,d1=ZB+(ZF-ZB)*(j3+1)/3;
    quad([[XL,0,d0],[XL,0,d1],[XL,0.95,d1],[XL,0.95,d0]],'#38414f');
    quad([[XL,0.95,d0],[XL,0.95,d1],[XL,H,d1],[XL,H,d0]],'#434e60');
    quad([[XR,0,d0],[XR,0,d1],[XR,0.95,d1],[XR,0.95,d0]],'#38414f');
    quad([[XR,0.95,d0],[XR,0.95,d1],[XR,H,d1],[XR,H,d0]],'#434e60');
  }
  quad([[XL,0,ZF],[XR,0,ZF],[XR,H,ZF],[XL,H,ZF]],'#2f3845');
  quad([[-2.95,0.85,ZB+0.04],[2.95,0.85,ZB+0.04],[2.95,2.55,ZB+0.04],[-2.95,2.55,ZB+0.04]],'#1b382a',{line:'#5d8d74'});
  quad([[-2.2,0,ZB+0.55],[2.2,0,ZB+0.55],[2.2,0.18,ZB+0.55],[-2.2,0.18,ZB+0.55]],'#5e4f3c');
  quad([[-2.2,0.18,ZB+0.55],[2.2,0.18,ZB+0.55],[2.2,0.18,ZB+1.15],[-2.2,0.18,ZB+1.15]],'#6f5e46');
  var xs=[-2.55,0,2.55],zs=[-2.55,-1.45,-0.35];
  zs.forEach(function(cz){ xs.forEach(function(cx){
    var w=1.25,dp=0.62,hh=0.76;
    quad([[cx-w/2,hh,cz-dp/2],[cx+w/2,hh,cz-dp/2],[cx+w/2,hh,cz+dp/2],[cx-w/2,hh,cz+dp/2]],'#7a6549');
    quad([[cx-w/2,hh-0.06,cz-dp/2],[cx+w/2,hh-0.06,cz-dp/2],[cx+w/2,hh-0.06,cz+dp/2],[cx-w/2,hh-0.06,cz+dp/2]],'#4e4132');
    quad([[cx-w/2,0,cz-dp/2],[cx+w/2,0,cz-dp/2],[cx+w/2,hh-0.06,cz-dp/2],[cx-w/2,hh-0.06,cz-dp/2]],'#4a3e30');
    quad([[cx+w/2,0,cz-dp/2],[cx+w/2,0,cz+dp/2],[cx+w/2,hh-0.06,cz+dp/2],[cx+w/2,hh-0.06,cz-dp/2]],'#3e3428');
    var chz=cz+0.62;
    quad([[cx-w/3,0.45,chz],[cx+w/3,0.45,chz],[cx+w/3,0.45,chz+0.44],[cx-w/3,0.45,chz+0.44]],'#3a4759');
    quad([[cx-w/3,0.45,chz+0.44],[cx+w/3,0.45,chz+0.44],[cx+w/3,0.95,chz+0.44],[cx-w/3,0.95,chz+0.44]],'#333e50');
  });});
  for(var k2=0;k2<3;k2++){
    var zz=-3.0+k2*2.3;
    quad([[XL+0.04,1.15,zz],[XL+0.04,1.15,zz+1.7],[XL+0.04,2.6,zz+1.7],[XL+0.04,2.6,zz]],'#93c8ea',{alpha:0.9,line:'#cfe9f8'});
  }
  [[-2.6,-2.6],[0,-2.6],[2.6,-2.6],[-2.6,0.9],[0,0.9],[2.6,0.9]].forEach(function(l){
    quad([[l[0]-0.6,H-0.03,l[1]-0.3],[l[0]+0.6,H-0.03,l[1]-0.3],[l[0]+0.6,H-0.03,l[1]+0.3],[l[0]-0.6,H-0.03,l[1]+0.3]],'#dbe9ff',{alpha:0.7});
  });
})();
function drawRoom(vp){
  var list=[];
  for(var i=0;i<ROOM.length;i++){
    var f=ROOM[i],ps=[],ok=true,ds=0;
    for(var k=0;k<4;k++){
      var p=project(f.p[k][0],f.p[k][1],f.p[k][2],vp);
      if(!p){ok=false;break;} ps.push(p); ds+=p.d;
    }
    if(ok) list.push({ps:ps,d:ds/4,f:f});
  }
  list.sort(function(a,b){return b.d-a.d;});
  for(var j=0;j<list.length;j++){
    var it=list[j];
    ctx.beginPath(); ctx.moveTo(it.ps[0].x,it.ps[0].y);
    for(var q=1;q<4;q++) ctx.lineTo(it.ps[q].x,it.ps[q].y);
    ctx.closePath();
    ctx.globalAlpha=(it.f.alpha||1)*0.85;
    ctx.fillStyle=shade(it.f.fill,it.f.shade); ctx.fill();
    if(it.f.line){ ctx.globalAlpha=0.22; ctx.strokeStyle=it.f.line; ctx.lineWidth=1; ctx.stroke(); }
    ctx.globalAlpha=1;
  }
}

/* ================= 树模型 ================= */
function buildTree(seq){
  var i=0,nodes=[],id=0;
  function b(d){ if(i>=seq.length) return -1; var ch=seq[i++]; if(ch==='#') return -1;
    var me=id++; nodes.push({id:me,ch:ch,depth:d,l:-1,r:-1,x:0});
    var L=b(d+1),R=b(d+1); nodes[me].l=L; nodes[me].r=R; return me; }
  var root=b(0),c=0;
  (function ino(n){ if(n<0)return; ino(nodes[n].l); nodes[n].x=c++; ino(nodes[n].r); })(root);
  var maxD=0; nodes.forEach(function(n){ if(n.depth>maxD) maxD=n.depth; });
  return {nodes:nodes,root:root,count:c,maxD:maxD};
}
function placeTree(T,cx,cy,cz,sc,opts){
  opts=opts||{};
  var half=(T.count-1)/2;
  T.nodes.forEach(function(n){
    var lx=(n.x-half)*1.0, ly=-(n.depth-T.maxD/2)*1.0;
    n.wx=cx+lx*sc; n.wy=cy+ly*sc*(opts.dy||0.95); n.wz=cz+(opts.zoff||0);
  });
  T._c={x:cx,y:cy,z:cz,sc:sc};
  return T;
}

/* ================= 绘制基元 ================= */
function line3(a,b,color,w){
  var pa=project(a[0],a[1],a[2],VP), pb=project(b[0],b[1],b[2],VP);
  if(!pa||!pb) return;
  ctx.strokeStyle=color; ctx.lineWidth=w||2;
  ctx.beginPath(); ctx.moveTo(pa.x,pa.y); ctx.lineTo(pb.x,pb.y); ctx.stroke();
}
function glowLine3(a,b,color,w,blur){
  var pa=project(a[0],a[1],a[2],VP), pb=project(b[0],b[1],b[2],VP);
  if(!pa||!pb) return;
  ctx.save();
  ctx.shadowColor=color; ctx.shadowBlur=blur||16;
  ctx.strokeStyle=color; ctx.lineWidth=w||3;
  ctx.beginPath(); ctx.moveTo(pa.x,pa.y); ctx.lineTo(pb.x,pb.y); ctx.stroke();
  ctx.restore();
}
function node3(p,r,fill,stroke,glow){
  var q=project(p[0],p[1],p[2],VP);
  if(!q) return null;
  var rr=Math.max(6,r*q.f);
  ctx.save();
  if(glow){ ctx.shadowColor=glow; ctx.shadowBlur=26; }
  ctx.beginPath(); ctx.arc(q.x,q.y,rr,0,Math.PI*2);
  var g=ctx.createRadialGradient(q.x-rr*.3,q.y-rr*.35,rr*.1,q.x,q.y,rr);
  g.addColorStop(0,'rgba(255,255,255,.9)');
  g.addColorStop(.45,fill);
  g.addColorStop(1,shade(fill,.55));
  ctx.fillStyle=g; ctx.fill();
  ctx.shadowBlur=0;
  if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=2; ctx.stroke(); }
  ctx.restore();
  return {x:q.x,y:q.y,r:rr,f:q.f};
}
function text3(p,str,color,size,dy,align){
  var q=project(p[0],p[1],p[2],VP);
  if(!q) return;
  ctx.save();
  ctx.fillStyle=color; ctx.textAlign=align||'center'; ctx.textBaseline='middle';
  ctx.font=(size||0.09)*q.f/1.0>0? (size||0.09)*q.f+'px "Microsoft YaHei",sans-serif':'12px';
  ctx.fillText(str,q.x,q.y+(dy||0));
  ctx.restore();
}
function label3(p,str,color,scale,dy){
  var q=project(p[0],p[1],p[2],VP);
  if(!q) return;
  var fs=Math.max(10,Math.min(26,(scale||0.11)*q.f));
  ctx.save();
  ctx.font='bold '+fs+'px "Microsoft YaHei",sans-serif';
  var w=ctx.measureText(str).width+14, h=fs+10;
  var x=q.x-w/2, y=q.y-h/2+(dy||0);
  ctx.fillStyle='rgba(8,14,22,.82)';
  ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(x,y,w,h,8); else ctx.rect(x,y,w,h);
  ctx.fill();
  ctx.strokeStyle=color; ctx.lineWidth=1.2; ctx.stroke();
  ctx.fillStyle=color; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(str,q.x,q.y+(dy||0));
  ctx.restore();
}

/* 画一棵树 */
function drawTreeModel(T,o){
  o=o||{};
  var N=T.nodes;
  N.forEach(function(n){
    [n.l,n.r].forEach(function(c){
      if(c<0) return;
      var act=(o.visited&&o.visited[n.id])&&(o.visited&&o.visited[c]);
      var a=[n.wx,n.wy,n.wz], b=[N[c].wx,N[c].wy,N[c].wz];
      if(act) glowLine3(a,b,'rgba(90,230,170,.9)',o.w||3,14);
      else line3(a,b,o.edgeColor||'rgba(130,175,235,.55)',o.w||2);
    });
  });
  var ordered=N.slice().sort(function(a,b){ return a.wz-b.wz; });
  ordered.forEach(function(n){
    var vis=o.visited&&o.visited[n.id];
    var cur=o.current===n.id;
    var hl=o.highlight&&o.highlight[n.id];
    var fill=cur?'#ffd166':(hl?'#ff9f43':(vis?'#4fd894':'#5b7fb0'));
    var glow=cur?'rgba(255,210,100,.95)':(hl?'rgba(255,150,60,.9)':(vis?'rgba(80,220,150,.7)':null));
    var r=o.r||0.13;
    var res=node3([n.wx,n.wy,n.wz],r,fill,'rgba(10,18,28,.85)',glow);
    if(res){
      ctx.save();
      ctx.fillStyle=cur?'#3a2500':(vis?'#03251a':'#e8f2ff');
      ctx.font='bold '+Math.max(9,res.r*1.1)+'px Consolas';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(n.ch,res.x,res.y+1);
      if(o.order&&o.order[n.id]!==undefined){
        ctx.font='bold '+Math.max(8,res.r*0.72)+'px Consolas';
        ctx.fillStyle='#ffd479';
        ctx.fillText(String(o.order[n.id]), res.x+res.r*0.95, res.y-res.r*0.95);
      }
      ctx.restore();
    }
    if(o.showDeg){
      var d=(n.l>=0?1:0)+(n.r>=0?1:0);
      text3([n.wx,n.wy+0.30,n.wz],String(d),'#ffd479',0.11,0);
    }
    if(o.showLevel){
      var q=project(T._c.x-((T.count-1)/2)*T._c.sc-0.75, T._c.y+(-(n.depth-T.maxD/2))*T._c.sc*0.95, T._c.z, VP);
      var pp=project(n.wx-0.42,n.wy,n.wz,VP);
      if(pp){ ctx.save(); ctx.fillStyle='rgba(120,190,240,.7)'; ctx.font='12px "Microsoft YaHei"';
        ctx.textAlign='right'; ctx.fillText('第'+(n.depth+1)+'层', pp.x-6, pp.y+4); ctx.restore(); }
    }
  });
}

/* ================= 课程数据 ================= */
var T7=buildTree('ABD##E##CF##G##');        // A(B(D,E),C(F,G))
var T6=buildTree('ABD##E##C#F##');           // 完全树 6 结点
var T5=buildTree('ABD##E##C##');             // 5 结点

var CHAPTERS=[
{ name:'1 认识二叉树', steps:[
  {t:'抬头看：这是一棵"倒挂的家族树"',
   p:'把二叉树想成一棵<b>倒挂的族谱</b>：根在最上面，往下是子孙。它和普通家族树的唯一区别——<span class="em">每个人最多只能有 2 个孩子</span>，而且分左右。',
   d:function(o){ placeTree(T7,0,2.15,-2.6,0.95); drawTreeModel(T7,{visited:all(T7),r:0.15,showLevel:false}); }},
  {t:'根结点 = 最上面的老祖宗',
   p:'整棵树只有一个<b>根结点</b>（这里是 A），它没有父亲。所有其他结点都能顺着线往上找，最终找到 A —— 这就是"根"的含义。',
   d:function(o){ drawTreeModel(T7,{highlight:{0:1},r:0.15}); label3([T7.nodes[0].wx,T7.nodes[0].wy+0.36,T7.nodes[0].wz],'根：老祖宗','#ff9f43',0.13); }},
  {t:'每个结点最多 2 个孩子 —— 这才叫"二叉"',
   p:'看 A：它只有 B、C 两个孩子。假设现在硬给 A 塞第三个孩子（画面里那个红色分支），它<b>马上被拒绝</b>。因为"二叉树"的定义里，每个结点度最大为 2。<span class="em">二叉 = 两个叉口</span>，没有第三个出口。',
   d:function(o){
     var tt=o.t||0, blink=Math.sin(tt*3)>0;
     drawTreeModel(T7,{highlight:{0:1,1:1,2:1},r:0.15});
     var A=T7.nodes[0];
     var p1=[A.wx,A.wy,A.wz];
     var p2=[A.wx+1.05,A.wy-0.75,A.wz];
     if(blink) glowLine3(p1,p2,'rgba(255,70,70,.95)',4,18); else line3(p1,p2,'rgba(255,70,70,.35)',2);
     var q=project(p2[0],p2[1],p2[2],VP);
     if(q){ ctx.save(); ctx.strokeStyle='#ff5252'; ctx.lineWidth=5;
       ctx.beginPath(); ctx.moveTo(q.x-12,q.y-12); ctx.lineTo(q.x+12,q.y+12);
       ctx.moveTo(q.x+12,q.y-12); ctx.lineTo(q.x-12,q.y+12); ctx.stroke(); ctx.restore(); }
     label3([p2[0]+0.2,p2[1]-0.25,p2[2]],'第 3 个孩子：不允许','#ff6b6b',0.1);
   }},
  {t:'左、右不能互换 —— 这是二叉树的灵魂',
   p:'左边这棵树是 A 的左孩子 B、右孩子 C；右边是 A 的左孩子 C、右孩子 B。<b>结点一模一样，但它们是两棵不同的树</b>。所以画二叉树时，左右位置必须画准，不能像普通树那样随便摆。',

function all(T){ var v={}; T.nodes.forEach(function(n){ v[n.id]=1; }); return v; }

/* ---- 遍历动画 ---- */
function orderOf(T,mode){
  var out=[],N=T.nodes;
  (function w(n){
    if(n<0) return;
    if(mode==='pre'){ out.push(n); w(N[n].l); w(N[n].r); }
    else if(mode==='in'){ w(N[n].l); out.push(n); w(N[n].r); }
    else if(mode==='post'){ w(N[n].l); w(N[n].r); out.push(n); }
  })(T.root);
  if(mode==='level'){
    var q=[T.root];
    while(q.length){ var p=q.shift(); out.push(p); if(N[p].l>=0)q.push(N[p].l); if(N[p].r>=0)q.push(N[p].r); }
  }
  return out;
}
function traversalDraw(T,mode,o){
  placeTree(T,0,1.85,-2.6,0.95);
  var ord=orderOf(T,mode), t=o.t||0;
  var stepDur=0.95, total=ord.length;
  var idx=Math.min(total,Math.floor(t/stepDur)+1);
  if(o.paused) idx=Math.min(total,Math.max(1,idx));
  var visited={}, order={};
  for(var i=0;i<idx;i++){ visited[ord[i]]=1; order[ord[i]]=i+1; }
  var cur=idx>0?ord[idx-1]:-1;
  drawTreeModel(T,{visited:visited,order:order,current:cur,r:0.15});
  // 访问序列
  var seq=ord.slice(0,idx).map(function(n){ return T.nodes[n].ch; }).join(' ');
  var full=ord.map(function(n){ return T.nodes[n].ch; }).join(' ');
  HUDLINES=[
    {text:'已访问：'+(seq||'—'),color:'#9be7a8',size:16},
    {text:'完整顺序：'+full,color:'#7f93ae',size:12}
  ];
}

var ARR_T=null;

  drawTreeModel(ARR_T,{visited:all(ARR_T),r:0.095});
  var n=ARR_T.count, slot=0.52, x0=-(n*slot)/2;
  for(var i=0;i<n;i++){
    var x=x0+i*slot, yb=0.95, yt=1.24;

    line3([x,yb,-2.6],[x,yt,-2.6],'rgba(120,180,235,.55)',1.6);
    line3([x+slot*0.88,yb,-2.6],[x+slot*0.88,yt,-2.6],'rgba(120,180,235,.55)',1.6);
    line3([x,yt,-2.6],[x+slot*0.88,yt,-2.6],'rgba(120,180,235,.55)',1.6);
    var nn=ARR_T.nodes[i];

    text3([x+slot*0.44,0.80,-2.6], String(i+1), '#7f93ae',0.075,0);
    if(nn) line3([nn.wx,nn.wy,nn.wz],[x+slot*0.44,1.26,-2.6],'rgba(90,220,255,.30)',1);
  }
  HUDLINES=[{text:'顺序存储：按层序放进数组，下标 = 位置',color:'#8fd3ff',size:14},
            {text:'左孩子 2i　右孩子 2i+1　双亲 ⌊i/2⌋',color:'#ffd479',size:13}];
}
function wasteDraw(o){
  var S=buildTree('A#B#C#D##'); placeTree(S,-2.4,2.15,-2.6,0.5);
  drawTreeModel(S,{visited:all(S),r:0.09});
  var filled=[1,0,2,0,0,0,3,0,0,0,0,0,0,0,4];

    line3([x,0.75,-2.6],[x+slot*0.86,0.75,-2.6],'rgba(120,180,235,.32)',1);

    line3([x,0.98,-2.6],[x+slot*0.86,0.98,-2.6],'rgba(120,180,235,.32)',1);

function linkDraw(o){
  var Lt=buildTree('ABD##E##CF##'); placeTree(Lt,0,2.25,-2.6,0.7);
  var N=Lt.nodes;
  N.forEach(function(n){
    [n.l,n.r].forEach(function(c){
      if(c<0) return;
      line3([n.wx,n.wy,n.wz],[N[c].wx,N[c].wy,N[c].wz],'rgba(130,175,235,.5)',1.8);
    });
  });
  N.forEach(function(n){
    var b=[n.wx,n.wy,n.wz];
    var w=0.62,h=0.22;
    var q=project(b[0],b[1],b[2],VP);
    if(!q) return;
    var pw=w*q.f, ph=h*q.f;
    ctx.save();
    ctx.fillStyle='rgba(10,18,28,.92)'; ctx.strokeStyle='rgba(120,190,240,.8)'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.rect(q.x-pw/2,q.y-ph/2,pw,ph); ctx.fill(); ctx.stroke();
    ctx.strokeStyle='rgba(120,190,240,.4)';
    ctx.beginPath();
    ctx.moveTo(q.x-pw/6,q.y-ph/2); ctx.lineTo(q.x-pw/6,q.y+ph/2);
    ctx.moveTo(q.x+pw/6,q.y-ph/2); ctx.lineTo(q.x+pw/6,q.y+ph/2);
    ctx.stroke();
    ctx.fillStyle='#8fd3ff'; ctx.font=Math.max(8,pw*0.11)+'px Consolas'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('L',q.x-pw/3,q.y); ctx.fillText('R',q.x+pw/3,q.y);
    ctx.fillStyle='#e8f2ff'; ctx.font='bold '+Math.max(9,pw*0.14)+'px Consolas';
    ctx.fillText(n.ch,q.x,q.y+1);
    ctx.restore();
  });
  HUDLINES=[{text:'链式存储：每个结点 = 左指针 | 数据 | 右指针',color:'#8fd3ff',size:14},
            {text:'想连哪就指哪，不用管树的形状',color:'#9be7a8',size:12}];
}

/* ---- 哈夫曼 ---- */
var HUFF=[
  {id:'r',w:18,x:0.3,y:2.85,par:null},
  {id:'a',w:7,x:1.9,y:2.30,par:'r'},
  {id:'b',w:11,x:-1.1,y:2.30,par:'r'},
  {id:'c',w:5,x:0.4,y:1.75,par:'b'},
  {id:'d',w:6,x:-1.9,y:1.75,par:'b'},
  {id:'e',w:2,x:-2.5,y:1.20,par:'d'},
  {id:'f',w:4,x:-1.3,y:1.20,par:'d'}
];
function huffDraw(stage){
  var vis={};
  if(stage>=0){ vis.e=1; vis.f=1; }
  if(stage>=1){ vis.d=1; }
  if(stage>=2){ vis.c=1; vis.b=1; }
  if(stage>=3){ vis.a=1; vis.r=1; }
  if(stage>=4){ vis.r=1; }
  var byId={}; HUFF.forEach(function(n){ byId[n.id]=n; });
  HUFF.forEach(function(n){
    if(n.par && vis[n.id] && vis[n.par]){
      line3([n.x,n.y,-2.5],[byId[n.par].x,byId[n.par].y,-2.5],
            n.id==='e'||n.id==='f'?'rgba(120,200,255,.6)':'rgba(130,175,235,.55)',2);
    }
  });
  HUFF.forEach(function(n){
    if(!vis[n.id]) return;
    var isLeaf=(n.id>='e'&&n.id<='f')||n.id==='c'||n.id==='a';
    var hl=(stage===1&&(n.id==='e'||n.id==='f'))||(stage===2&&(n.id==='c'||n.id==='d'))||(stage===3&&(n.id==='a'||n.id==='b'));
    node3([n.x,n.y,-2.5],0.11,hl?'#ff9f43':(isLeaf?'#5b7fb0':'#4a6f9e'),'rgba(10,18,28,.85)',hl?'rgba(255,150,60,.9)':null);
    var q=project(n.x,n.y,-2.5,VP);
    if(q){ ctx.save(); ctx.fillStyle='#eaf4ff'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.font='bold '+Math.max(9,q.f*0.075)+'px Consolas'; ctx.fillText(String(n.w),q.x,q.y+1); ctx.restore(); }
    if(stage>=3){
      var dep={r:0,a:1,b:1,c:2,d:2,e:3,f:3}[n.id];
      text3([n.x+0.28,n.y,-2.5],'×'+dep,'#7f93ae',0.07,0);
    }
  });
  // 森林列表
  var forest=[];
  if(stage===0) forest=[2,4,5,7];
  if(stage===1) forest=[6,5,7];
  if(stage===2) forest=[11,7];
  if(stage>=3) forest=[18];
  var txt=forest.map(function(w){ return w; }).join('   ');
  HUDLINES=[{text:'当前森林：'+txt,color:'#ffd479',size:15}];
  if(stage>=3) HUDLINES.push({text:'WPL = 2×3 + 4×3 + 5×2 + 7×1 = 35',color:'#9be7a8',size:16});
  if(stage>=4) HUDLINES.push({text:'大权近根（7 只走 1 步），小权远根（2、4 走 3 步）',color:'#8fd3ff',size:13});
}

/* ================= 2D 文字层 ================= */
var HUDLINES=[];
function drawHUD(){
  if(!HUDLINES.length) return;
  var W=cv.clientWidth||360;
  ctx.save(); ctx.textAlign='center'; ctx.textBaseline='middle';
  var y=112;
  HUDLINES.forEach(function(l){
    var fs2=l.size||14;
    ctx.font='bold '+fs2+'px "Microsoft YaHei",sans-serif';
    var w=ctx.measureText(l.text).width+22;
    ctx.fillStyle='rgba(8,14,22,.78)';
    ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(W/2-w/2,y-fs2*0.85,w,fs2*1.7,9); else ctx.rect(W/2-w/2,y-fs2*0.85,w,fs2*1.7);
    ctx.fill();
    ctx.strokeStyle='rgba(120,190,240,.25)'; ctx.lineWidth=1; ctx.stroke();
    ctx.fillStyle=l.color||'#cfe0f5'; ctx.fillText(l.text,W/2,y);
    y+=fs2*2.0;
  });
  ctx.restore();
}

/* ================= 状态 ================= */
var VP=null;
var S={ c:0, s:0, playing:false, t0:0, paused:false,
        eye:{x:0,y:1.72,z:2.9}, yaw:0, pitch:0.02, drag:null };

function focalOf(){ return Math.min(cv.clientWidth||360, cv.clientHeight||640)*0.95; }
function vpMake(){
  var W=cv.clientWidth||360,H=cv.clientHeight||640;
  return {vw:W,vh:H,ex:S.eye.x,ey:S.eye.y,ez:S.eye.z,yaw:S.yaw,pitch:S.pitch,focal:focalOf(),shiftX:0};
}

/* ================= 渲染 ================= */
function chapter(){ return CHAPTERS[S.c]; }
function step(){ return chapter().steps[S.s]; }

function render(now){
  var W=cv.clientWidth||360,H=cv.clientHeight||640;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  var bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#070c14'); bg.addColorStop(1,'#04060a');
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
  VP=vpMake();
  drawRoom(VP);
  HUDLINES=[];
  var st=step();
  if(st&&st.d) st.d({t:((now-S.t0)/1000),paused:S.paused});
  drawHUD();
}
function updateCaption(){
  var st=step(); if(!st) return;
  document.getElementById('capT').textContent=chapter().name+' · '+st.t;
  document.getElementById('capB').innerHTML=st.p;
  document.getElementById('prog').textContent=(S.s+1)+' / '+chapter().steps.length;
  Array.prototype.forEach.call(document.querySelectorAll('.ch'),function(b){
    b.classList.toggle('on',+b.getAttribute('data-c')===S.c);
  });
}
function goto(c,s){
  S.c=Math.max(0,Math.min(CHAPTERS.length-1,c));
  S.s=Math.max(0,Math.min(CHAPTERS[S.c].steps.length-1,s));
  S.t0=performance.now(); S.paused=false;
  updateCaption();
}
document.getElementById('prev').addEventListener('click',function(){
  if(S.s>0) goto(S.c,S.s-1); else if(S.c>0) goto(S.c-1,CHAPTERS[S.c-1].steps.length-1);
});
document.getElementById('next').addEventListener('click',function(){
  if(S.s<chapter().steps.length-1) goto(S.c,S.s+1); else if(S.c<CHAPTERS.length-1) goto(S.c+1,0);
});
document.getElementById('play').addEventListener('click',function(){
  S.playing=!S.playing; this.textContent=S.playing?'❚❚ 暂停':'▶ 播放';
  S.t0=performance.now();
});
Array.prototype.forEach.call(document.querySelectorAll('.ch'),function(b){
  b.addEventListener('click',function(){ goto(+b.getAttribute('data-c'),0); });
});

/* 拖拽环顾 */
cv.addEventListener('mousedown',function(e){ S.drag={x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY}; });
window.addEventListener('mouseup',function(e){
  if(S.drag){
    var moved=Math.abs(e.clientX-S.drag.sx)+Math.abs(e.clientY-S.drag.sy);
    if(moved<5) S.paused=!S.paused;
  }
  S.drag=null;
});
window.addEventListener('mousemove',function(e){
  if(S.drag){
    S.yaw+=(e.clientX-S.drag.x)*0.003;
    S.pitch=Math.max(-0.6,Math.min(0.6,S.pitch+(e.clientY-S.drag.y)*0.002));
    S.drag.x=e.clientX; S.drag.y=e.clientY;
  }
});
var tstart=null;
cv.addEventListener('touchstart',function(e){ if(e.touches.length===1){ var t=e.touches[0]; tstart={x:t.clientX,y:t.clientY,sx:t.clientX,sy:t.clientY}; } },{passive:true});
cv.addEventListener('touchmove',function(e){
  if(tstart&&e.touches.length===1){ var t=e.touches[0];
    S.yaw+=(t.clientX-tstart.x)*0.004; S.pitch=Math.max(-0.6,Math.min(0.6,S.pitch+(t.clientY-tstart.y)*0.003));
    tstart.x=t.clientX; tstart.y=t.clientY; }
},{passive:true});
cv.addEventListener('touchend',function(e){
  if(tstart){ var t=e.changedTouches[0];
    if(t&&Math.abs(t.clientX-tstart.sx)+Math.abs(t.clientY-tstart.sy)<8) S.paused=!S.paused; }
  tstart=null;
});

/* 主循环 */
function resize(){
  var r=cv.getBoundingClientRect();
  var w=Math.round((r.width||window.innerWidth||360)*DPR), h=Math.round((r.height||window.innerHeight||640)*DPR);
  if(w>0&&h>0&&(w!==cv.width||h!==cv.height)){ cv.width=w; cv.height=h; }
}
window.addEventListener('resize',resize);
var last=0;
function loop(now){
  resize();
  if(S.playing && now-last>2200){
    last=now;
    var ch=chapter();
    if(S.s<ch.steps.length-1) goto(S.c,S.s+1); else { S.playing=false; document.getElementById('play').textContent='▶ 播放'; }
  }
  render(now);
  requestAnimationFrame(loop);
}
resize();
goto(0,0);
requestAnimationFrame(loop);
window.__S=S; window.__CH=CHAPTERS;
})();
</script>
